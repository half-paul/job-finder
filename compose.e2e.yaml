# TEST-ONLY OVERLAY. Never apply this file outside a local or CI e2e run:
#   docker compose -f compose.yaml -f compose.e2e.yaml up -d
#
# Every key here exists solely so tests/e2e/crawler.spec.ts's self-signed,
# private-address fixture (served at https://host.docker.internal:<port>) is
# reachable and trusted. None of it is safe against real traffic:
#
# - CRAWLER_INSECURE_TLS and NODE_TLS_REJECT_UNAUTHORIZED disable certificate
#   verification for Chromium and for Node's own `fetch` (used by
#   apps/crawler/src/robots.ts) respectively. They are two different HTTP
#   clients inside the same container, so both must be set or one of them
#   still fails closed against the fixture's self-signed certificate.
# - CRAWLER_INSECURE_TEST_HOSTNAME is the test-only SSRF allowlist gate
#   (apps/crawler/src/policy.ts, `insecureTestHostnameAllowed`): it permits
#   exactly the one literal hostname named here — nothing else, no ranges —
#   to resolve to a private address. It is read by the crawler's own code,
#   is not documented in .env.example, and is never set in compose.yaml, so
#   there is no ordinary configuration path (an operator's own .env.local
#   would still need to know this exact, undocumented variable name and
#   would still only unlock the one named hostname) that turns it on.
# - extra_hosts makes host.docker.internal resolvable from inside the
#   container on Linux (the `host-gateway` special value), not only on
#   Docker Desktop; the e2e fixture server binds to the CI runner/host itself.
# - The published port lets a host-run Playwright process reach the
#   otherwise-unpublished crawler service directly.
services:
  crawler:
    environment:
      CRAWLER_INSECURE_TLS: "1"
      NODE_TLS_REJECT_UNAUTHORIZED: "0"
      CRAWLER_INSECURE_TEST_HOSTNAME: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:4000:4000"
