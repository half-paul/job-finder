name: Verify foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobfinder
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: jobfinder
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jobfinder -d jobfinder"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://jobfinder:ci-only-password@localhost:5432/jobfinder
      APP_ORIGIN: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # Installed before `npm test`, not after: tests/unit/crawler-*.test.ts
      # launches a real Chromium and fails (not skips) when it is absent, by
      # design — a silently-skipped security test is how the SSRF this suite
      # guards against survived three earlier review rounds.
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run db:migrate
      - run: npm audit --audit-level=moderate
      - run: npm run build
      # The crawler runs as its own container, with the e2e-only overlay that
      # tests/e2e/crawler.spec.ts needs (its private-address test fixture and
      # relaxed TLS for a self-signed cert — see compose.e2e.yaml). This is
      # the only compose service started in CI; postgres is the job's own
      # `services:` container above, and web/worker run directly via
      # Playwright's `webServer` (playwright.config.ts).
      - run: docker compose -f compose.yaml -f compose.e2e.yaml up -d --build crawler
      - run: npm run test:e2e
      - run: docker compose -f compose.yaml -f compose.e2e.yaml down -v
        if: always()
      - run: docker build -t jobfinder:ci .
      - run: docker build -f apps/crawler/Dockerfile -t jobfinder-crawler:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results/
