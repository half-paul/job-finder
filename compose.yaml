services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: jobfinder
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 3s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://jobfinder:local-development-only@postgres:5432/jobfinder
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: .
    command: npm run start
    environment:
      DATABASE_URL: postgresql://jobfinder:local-development-only@postgres:5432/jobfinder
      APP_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
