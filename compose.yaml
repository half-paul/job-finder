# Two networks, not one, so the isolation the crawler needs is a network fact
# and not just an absent environment variable. `app` carries Postgres traffic;
# `crawler-net` is the only network the crawler joins. The crawler therefore
# has no route to `postgres` or to `web` at the Compose level, in addition to
# never being given DATABASE_URL. `worker` is the only service on both
# networks, because it alone needs to reach both Postgres and the crawler.
#
# This is what Compose can genuinely enforce: which services can talk to which
# other services. It does NOT, and cannot, restrict the crawler's OUTBOUND
# egress by destination IP range — see doc/architecture.md's "Crawler
# isolation boundary" section for the host/cloud-level control that requires
# and why the crawler's own address checks are mitigation, not prevention.
networks:
  app:
  crawler-net:
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: jobfinder
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 3s
      timeout: 5s
      retries: 20
    networks:
      - app
  migrate:
    build: .
    command: npm run db:migrate
    environment:
      DATABASE_URL: postgresql://jobfinder:local-development-only@postgres:5432/jobfinder
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app
  web:
    build: .
    command: npm run start
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://jobfinder:local-development-only@postgres:5432/jobfinder
      APP_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - app
  worker:
    build: .
    command: npm run worker
    env_file:
      - path: .env.local
        required: false
    environment:
      DATABASE_URL: postgresql://jobfinder:local-development-only@postgres:5432/jobfinder
      APP_ORIGIN: http://localhost:3000
      CRAWLER_URL: http://crawler:4000
      CRAWLER_SECRET: local-development-only
    # Scheduled scans, evaluation, digest and cleanup run here and nowhere else.
    # No ports are published; the worker only talks to PostgreSQL and providers.
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # The only service on both networks: it owns the database connection and
    # is the sole caller of the crawler.
    networks:
      - app
      - crawler-net
  crawler:
    build:
      context: .
      dockerfile: apps/crawler/Dockerfile
    command: npm run crawler
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: "4000"
      CRAWLER_SECRET: local-development-only
    # Deliberately no DATABASE_URL and no published port: the crawler runs
    # untrusted pages and must not be able to reach PostgreSQL or the host.
    # host.docker.internal is resolvable on Docker Desktop but not on Linux CI;
    # tests/e2e/crawler.spec.ts serves its fixture origin there. compose.e2e.yaml
    # (never applied here) adds the extra_hosts entry and test-only overrides
    # that e2e run needs; this production-shaped definition stays clean.
    restart: unless-stopped
    networks:
      - crawler-net
volumes:
  postgres-data:
